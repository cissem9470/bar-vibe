name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/barvibe.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/barvibe.jks"
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../bar-vibe.apk
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../bar-vibe.apk
          fi
      - name: Publish to the Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Bar Vibe for Android (pilot)" --notes "Pilot build. Download bar-vibe.apk on an Android phone and open it to install."
          gh release upload android bar-vibe.apk --clobber
          gh release edit android --notes "Pilot build 0.1.${{ github.run_number }}. Download bar-vibe.apk on an Android phone and open it to install." --latest
